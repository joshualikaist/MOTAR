params:
  seed: 42
  algo:
    name: a2c_continuous
  model:
    name: continuous_a2c_logstd
  load_checkpoint: False

  network:
    # 17 structured temporal tokens; raw sensors and semantic/GT target channels are forbidden.
    name: navrl_transformer
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True

  config:
    env_name: navrl_task
    env_config:
      num_envs: 128
    name: gen_ppo
    reward_shaper:
      scale_value: 0.1
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    ppo: True
    # Stability (2026-07-23): a_loss/entropy/KL diverged AFTER the policy started learning (captured
    # rose to ~0.4 then decayed to ~0.1 at CONSTANT curriculum difficulty). Lowered the actor LR
    # 3e-4 -> 1e-4 (Transformer policies destabilize at higher LR) and enabled value clipping below;
    # the real culprit is the privileged critic's fixed 5e-4 LR (fixed further down).
    learning_rate: 1e-4
    lr_schedule: adaptive
    kl_threshold: 0.016
    save_best_after: 20
    save_frequency: 50
    score_to_win: 100000
    grad_norm: 1.0
    entropy_coef: 0.01   # was 0.0 -- with dropout removed AND fixed_sigma, there was NO exploration
                         # regularizer, so the policy collapsed to the safe hover local optimum
                         # (100% timeout) before learning to capture. A proper PPO entropy bonus
                         # keeps the policy exploring long enough to escape the hover trap.
    truncate_grads: True
    e_clip: 0.2
    clip_value: True    # was False -- clip value updates to contain the value-driven divergence
    num_actors: 128
    horizon_length: 32
    minibatch_size: 2048
    mini_epochs: 4
    critic_coef: 2
    normalize_input: True
    bounds_loss_coef: 0.0001
    max_epochs: 6000
    normalize_value: True
    use_diagnostics: True
    value_bootstrap: True
    use_smooth_clamp: False

    # Oracle target state exists only in this train-time central value network.
    central_value_config:
      minibatch_size: 2048
      mini_epochs: 4
      learning_rate: 1e-4   # was 5e-4 FIXED -- higher than the actor and non-adaptive, so the
      lr_schedule: None     # privileged critic diverged and corrupted the actor's advantages.
      clip_value: True      # was False -- add value clipping; slow the critic to match the actor.
      normalize_input: True
      truncate_grads: True
      grad_norm: 1.0
      network:
        name: actor_critic
        central_value: True
        mlp:
          units: [256, 256]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None

    player:
      render: False
      deterministic: True
      games_num: 100
