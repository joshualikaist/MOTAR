<title id="figure-title">Actor observation data structure</title>
<desc id="figure-desc">288 + 480 + 50 + 80 = 898 flat actor values; 17 embedded tokens include CLS. Five history slots nominally span two seconds; tracker expiry is five seconds. No direct target ground truth enters the actor.</desc>
