<title id="figure-title">Verified sensor-to-action architecture</title>
<desc id="figure-desc">Historical Policy F closed loop. Sensor models and own state feed perception; 898 flat values precede tokenization. PI altitude hold replaces actor z. Baseline riskcap and experimental arc-clearance are alternatives.</desc>
