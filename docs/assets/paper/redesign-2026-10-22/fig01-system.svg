   </g>
   <g id="text_15">
    <text style="fill: #172b3a; font: 700 8.8px 'Liberation Sans'; text-anchor: start" x="173.248302" y="221.379545" transform="rotate(-0 173.248302 221.379545)">Lee velocity control + PhysX</text>
   </g>
   <g id="text_16">
    <text style="fill: #546675; font: 8px 'Liberation Sans'; text-anchor: start" x="173.248302" y="242.863246" transform="rotate(-0 173.248302 242.863246)">Velocity/yaw → thrust + torques</text>
   </g>
