   <g id="text_10">
    <text style="fill: #546675; font: 8px 'Liberation Sans'" transform="translate(173.248302 123.866058)">Camera measurement + LiDAR aid</text>
    <text style="fill: #546675; font: 8px 'Liberation Sans'" transform="translate(173.248302 133.642558)">6-D target state, 6 × 6 covariance</text>
    <text style="fill: #546675; font: 8px 'Liberation Sans'" transform="translate(173.248302 143.419058)">Obstacle features + sampled history</text>
   </g>
   <g id="text_11">
    <text style="fill: #172b3a; font: 700 8.8px 'Liberation Sans'; text-anchor: start" x="345.151698" y="67.817945" transform="rotate(-0 345.151698 67.817945)">Frozen Transformer PPO</text>
   </g>
   <g id="text_12">
    <text style="fill: #546675; font: 8px 'Liberation Sans'" transform="translate(345.151698 123.866058)">898-D observation → 17 tokens</text>
    <text style="fill: #546675; font: 8px 'Liberation Sans'" transform="translate(345.151698 133.642558)">Actor outputs 4 components</text>
    <text style="fill: #546675; font: 8px 'Liberation Sans'" transform="translate(345.151698 143.419058)">Task replaces z with altitude hold</text>
   </g>
   <g id="text_13">
    <text style="fill: #172b3a; font: 700 8.8px 'Liberation Sans'; text-anchor: start" x="345.151698" y="221.360295" transform="rotate(-0 345.151698 221.360295)">XY speed governor</text>
   </g>
   <g id="text_14">
