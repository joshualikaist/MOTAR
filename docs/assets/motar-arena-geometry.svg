<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="ui-sans-serif,system-ui,'Helvetica Neue',Arial,sans-serif">
  <title>MOTAR arena geometry: 40x40x3 m field, bar obstacles, goal band and sensor envelopes drawn to scale</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker>
    <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#718096"/></marker>
  </defs>
  <rect width="960" height="560" fill="#fbfdfc"/>
  <text x="28" y="34" font-size="17" font-weight="700" fill="#1a202c">ARENA GEOMETRY · 축척 그림 (1 px = 0.05 m)</text>
  <text x="28" y="54" font-size="12" fill="#4a5568">모든 치수는 URDF와 실행 설정에서 읽은 값이다. 막대 배치는 예시이고 개수·밀도는 실제 값이다.</text>

  <!-- top-down arena -->
  <g transform="translate(40,80)">
    <rect x="0" y="0" width="400" height="400" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
    <text x="200" y="-10" font-size="12" font-weight="600" text-anchor="middle" fill="#2d3748">평면도 · 40 × 40 m</text>
    <!-- goal band annulus -->
    <path d="M40,360 m0,0 A 225,225 0 0 1 265,135" fill="none" stroke="#38a169" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M40,360 m0,0 A 280,280 0 0 1 320,80" fill="none" stroke="#38a169" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="250" y="250" font-size="11" fill="#276749" font-weight="600">goal band</text>
    <text x="250" y="264" font-size="10" fill="#276749">22.5 – 28 m</text>
    <!-- bars (to scale: 0.7096 x 0.5756 m -> 7.1 x 5.8 px) -->
    <g fill="#a0aec0" stroke="#718096" stroke-width="0.5">
      <rect x="70" y="300" width="7.1" height="5.8"/><rect x="120" y="270" width="7.1" height="5.8"/>
      <rect x="95" y="215" width="7.1" height="5.8"/><rect x="160" y="240" width="7.1" height="5.8"/>
      <rect x="145" y="180" width="7.1" height="5.8"/><rect x="205" y="205" width="7.1" height="5.8"/>
      <rect x="185" y="140" width="7.1" height="5.8"/><rect x="250" y="165" width="7.1" height="5.8"/>
      <rect x="230" y="105" width="7.1" height="5.8"/><rect x="290" y="130" width="7.1" height="5.8"/>
      <rect x="110" y="335" width="7.1" height="5.8"/><rect x="175" y="310" width="7.1" height="5.8"/>
      <rect x="265" y="230" width="7.1" height="5.8"/><rect x="310" y="195" width="7.1" height="5.8"/>
      <rect x="60" y="245" width="7.1" height="5.8"/><rect x="135" y="120" width="7.1" height="5.8"/>
    </g>
    <!-- lidar 12 m disc -->
    <circle cx="40" cy="360" r="120" fill="#3182ce" fill-opacity="0.05" stroke="#3182ce" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="122" y="298" font-size="10" fill="#2b6cb0">LiDAR 12 m</text>
    <!-- camera 87 deg wedge, detector 20 m -->
    <path d="M40,360 L 213,187 A 245,245 0 0 0 40,115 Z" fill="#dd6b20" fill-opacity="0.10" stroke="#dd6b20" stroke-width="1"/>
    <text x="60" y="150" font-size="10" fill="#9c4221">camera 87° · 20 m</text>
    <!-- pursuer + target -->
    <circle cx="40" cy="360" r="4" fill="#2b6cb0"/>
    <text x="18" y="380" font-size="10" font-weight="600" fill="#2b6cb0">pursuer</text>
    <circle cx="268" cy="152" r="4" fill="#c53030"/>
    <text x="278" y="150" font-size="10" font-weight="600" fill="#c53030">target 0.3–1.5 m/s</text>
    <line x1="40" y1="360" x2="262" y2="158" stroke="#2b6cb0" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
    <!-- scale bar -->
    <line x1="300" y1="380" x2="400" y2="380" stroke="#2d3748" stroke-width="2"/>
    <line x1="300" y1="375" x2="300" y2="385" stroke="#2d3748" stroke-width="2"/>
    <line x1="400" y1="375" x2="400" y2="385" stroke="#2d3748" stroke-width="2"/>
    <text x="350" y="395" font-size="10" text-anchor="middle" fill="#2d3748">10 m</text>
  </g>

  <!-- side view -->
  <g transform="translate(490,80)">
    <text x="0" y="-10" font-size="12" font-weight="600" fill="#2d3748">측면도 · 높이 3 m</text>
    <rect x="0" y="240" width="430" height="60" fill="#ffffff" stroke="#2d3748" stroke-width="2"/>
    <line x1="0" y1="300" x2="430" y2="300" stroke="#2d3748" stroke-width="2.5"/>
    <text x="-6" y="304" font-size="10" text-anchor="end" fill="#4a5568">0 m</text>
    <text x="-6" y="244" font-size="10" text-anchor="end" fill="#4a5568">3 m</text>
    <!-- bars 2.0 m tall -> 40 px -->
    <g fill="#a0aec0" stroke="#718096">
      <rect x="70" y="260" width="14" height="40"/><rect x="180" y="260" width="14" height="40"/>
      <rect x="300" y="260" width="14" height="40"/><rect x="380" y="260" width="14" height="40"/>
    </g>
    <text x="77" y="255" font-size="9" text-anchor="middle" fill="#4a5568">2.0 m</text>
    <!-- cruise altitude 1.0 m -> y=280 -->
    <line x1="0" y1="280" x2="430" y2="280" stroke="#2b6cb0" stroke-width="1" stroke-dasharray="4 3"/>
    <circle cx="130" cy="280" r="4" fill="#2b6cb0"/>
    <text x="140" y="277" font-size="10" fill="#2b6cb0">고도 1.0 m · altitude PI가 고정</text>
    <!-- lidar vertical fov +20/-10 -->
    <path d="M130,280 L 300,218 L 300,310 Z" fill="#3182ce" fill-opacity="0.10" stroke="#3182ce" stroke-width="1"/>
    <text x="306" y="222" font-size="9" fill="#2b6cb0">+20°</text>
    <text x="306" y="314" font-size="9" fill="#2b6cb0">−10°</text>
    <text x="200" y="330" font-size="10" fill="#2b6cb0">LiDAR 수직 FOV — 4빔, 빔 간격 10°</text>
    <text x="0" y="352" font-size="10" fill="#4a5568">막대가 2.0 m로 높아 어떤 빔에는 반드시 걸린다 → 수직은 사각이 아니다 (측정: VERTICAL_OUT 0.0 %)</text>
  </g>

  <!-- density table -->
  <g transform="translate(490,410)">
    <text x="0" y="0" font-size="12" font-weight="600" fill="#2d3748">밀도 계보</text>
    <text x="0" y="20" font-size="11" fill="#4a5568">70 bars = 4.38 / 100 m²  ·  바닥면적 1.8 %</text>
    <text x="0" y="38" font-size="11" fill="#4a5568">205 bars = 12.81 / 100 m²  ·  바닥면적 5.2 %</text>
    <text x="0" y="56" font-size="11" fill="#4a5568">계보 밀도 70 / 115 / 160 / 205 · 300은 disconnected stress</text>
    <text x="0" y="80" font-size="10" fill="#718096">막대 0.7096 × 0.5756 × 2.0 m (bar_000.urdf) · 표면 여유 0.45 m · 중첩 금지</text>
  </g>
</svg>
