<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">Current MOTAR system overview</title>
  <desc id="desc">Current software path. Camera, LiDAR and ego-state are encoded as structured history tokens, processed by a Transformer policy, and converted to bounded flight commands for moving-target interception. The camera path still uses one detector output and one Kalman target track.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf8"/><stop offset="1" stop-color="#edf5f2"/>
    </linearGradient>
    <linearGradient id="policy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#087f6d"/><stop offset="1" stop-color="#075f56"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63736d"/>
    </marker>
    <style>
      .label{font:700 25px Arial,sans-serif;fill:#17231f}.small{font:500 17px Arial,sans-serif;fill:#5d6b66}.tiny{font:600 14px Arial,sans-serif;fill:#71807a;letter-spacing:.06em}.badge{font:700 13px Arial,sans-serif;fill:#075f56;letter-spacing:.07em}.box{fill:#fff;stroke:#cad8d2;stroke-width:2}.line{fill:none;stroke:#63736d;stroke-width:3;marker-end:url(#arrow)}.token{fill:#dceee8;stroke:#a8cfc2;stroke-width:1.5}.white{fill:#fff}.muted{fill:#d6e9e3}
    </style>
  </defs>
  <rect width="1440" height="620" rx="32" fill="url(#bg)"/>
  <text x="68" y="72" class="tiny">MOTAR · SENSOR-ONLY MOVING-TARGET INTERCEPTION</text>
  <text x="68" y="114" class="label" font-size="32">From perception to physically bounded flight</text>
  <rect x="1110" y="47" width="262" height="38" rx="19" fill="#dceee8" stroke="#9ccabd" stroke-width="1.5"/>
  <text x="1140" y="71" class="badge">CURRENT SOFTWARE PATH</text>

  <g transform="translate(68 164)">
    <rect class="box" width="245" height="328" rx="22"/>
    <text x="28" y="44" class="tiny">SENSING</text>
    <g transform="translate(28 70)">
      <circle cx="26" cy="26" r="25" fill="#dceee8"/><path d="M12 26h28M26 12v28" stroke="#087f6d" stroke-width="3"/>
      <text x="68" y="23" class="label">RGB-D</text><text x="68" y="46" class="small">1 detector → 1 KF track</text>
    </g>
    <g transform="translate(28 150)">
      <circle cx="26" cy="26" r="25" fill="#dceee8"/><circle cx="26" cy="26" r="14" fill="none" stroke="#087f6d" stroke-width="3"/><path d="M26 5v10M47 26H37M26 47V37M5 26h10" stroke="#087f6d" stroke-width="3"/>
      <text x="68" y="23" class="label">LiDAR</text><text x="68" y="46" class="small">4 × 72 rays · 12 m</text>
    </g>
    <g transform="translate(28 230)">
      <circle cx="26" cy="26" r="25" fill="#dceee8"/><path d="M13 34l13-21 13 21z" fill="none" stroke="#087f6d" stroke-width="3"/>
      <text x="68" y="23" class="label">Ego-state</text><text x="68" y="46" class="small">velocity · yaw · height</text>
    </g>
  </g>

  <path class="line" d="M329 328H402"/>

  <g transform="translate(416 164)">
    <rect class="box" width="300" height="328" rx="22"/>
    <text x="28" y="44" class="tiny">STRUCTURED HISTORY</text>
    <text x="28" y="83" class="label">898-D observation</text>
    <text x="28" y="110" class="small">17 tokens · 5 time steps</text>
    <g transform="translate(28 144)">
      <rect class="token" width="244" height="34" rx="8"/><text x="14" y="23" class="small">static scan · 288</text>
      <rect class="token" y="45" width="244" height="34" rx="8"/><text x="14" y="68" class="small">obstacles · 480</text>
      <rect class="token" y="90" width="244" height="34" rx="8"/><text x="14" y="113" class="small">robot history · 50</text>
      <rect class="token" y="135" width="244" height="34" rx="8"/><text x="14" y="158" class="small">target history · 80</text>
    </g>
  </g>

  <path class="line" d="M732 328H805"/>

  <g transform="translate(819 164)">
    <rect width="260" height="328" rx="22" fill="url(#policy)"/>
    <text x="28" y="44" class="tiny muted">LEARNED POLICY</text>
    <text x="28" y="87" class="label white">Transformer</text>
    <text x="28" y="116" class="small muted">4 layers · 4 heads</text>
    <g transform="translate(28 153)">
      <rect x="0" y="0" width="40" height="40" rx="8" fill="#fff" opacity=".92"/>
      <rect x="51" y="0" width="40" height="40" rx="8" fill="#fff" opacity=".72"/>
      <rect x="102" y="0" width="40" height="40" rx="8" fill="#fff" opacity=".72"/>
      <rect x="153" y="0" width="40" height="40" rx="8" fill="#fff" opacity=".72"/>
      <path d="M20 62h173" stroke="#9bd1c5" stroke-width="2" stroke-dasharray="5 5"/>
      <text x="0" y="100" class="small white">PPO actor + critic</text>
      <text x="0" y="130" class="small muted">bounded 4-D action</text>
    </g>
  </g>

  <path class="line" d="M1095 328H1168"/>

  <g transform="translate(1182 164)">
    <rect class="box" width="190" height="328" rx="22"/>
    <text x="24" y="44" class="tiny">FLIGHT</text>
    <text x="24" y="85" class="label">Controller</text>
    <text x="24" y="113" class="small">velocity + yaw</text>
    <g transform="translate(35 151)" stroke="#087f6d" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M60 45L20 15M60 45l40-30M60 45L20 75M60 45l40 30"/>
      <circle cx="60" cy="45" r="17" fill="#dceee8"/>
      <circle cx="15" cy="11" r="12"/><circle cx="105" cy="11" r="12"/><circle cx="15" cy="79" r="12"/><circle cx="105" cy="79" r="12"/>
    </g>
    <text x="24" y="280" class="small">100 Hz physics</text>
    <text x="24" y="306" class="small">moving target</text>
  </g>

  <path d="M949 506v55H565v-55" fill="none" stroke="#9aa8a3" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="655" y="590" class="small">training only · ground-truth reward + asymmetric critic</text>
</svg>
